[package]
name = "ascension-platform-linux-descriptors"
version = "0.1.0"
description = "Narrow Linux inherited-descriptor duplication boundary"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

# Only the annotated duplication function admits unsafe code. The portable
# watchdog and workspace-wide forbid policy are unchanged.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
