[package]
name = "watchdog-fault-fixture"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Test-only synthetic recovery host for watchdog crash and fencing tests"

[lib]
name = "fault_fixture"
path = "src/lib.rs"

[[bin]]
name = "fault-fixture-server"
path = "src/bin/server.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
