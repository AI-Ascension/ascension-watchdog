name: Rust and synthetic validation

on:
  pull_request:
  push:
    branches: [bootstrap]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust and synthetic processes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Verify whitespace
        run: git diff --check
      - name: Soak finalizer fail-closed regressions
        if: runner.os == 'Linux'
        run: sh deploy/soak/crossrepo-campaign-finalize.test.sh
      - name: Soak campaign sideband fail-closed regressions
        if: runner.os == 'Linux'
        run: sh deploy/soak/crossrepo-campaign-sideband.test.sh
      - name: Soak campaign lifecycle fail-closed regressions
        if: runner.os == 'Linux'
        run: sh deploy/soak/crossrepo-campaign-lifecycle.test.sh
      - name: Supervisor soak bring-up fail-closed regressions
        if: runner.os == 'Linux'
        run: sh deploy/soak/supervisor-soak-lifecycle.test.sh
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation links
        if: runner.os == 'Linux'
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links --document-private-items" cargo doc --workspace --no-deps --locked
      - name: Run unit and synthetic tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
      - name: Classify Windows hosted-session evidence
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $receipt = Join-Path $env:RUNNER_TEMP "watchdog-hosted-session-classification.log"
          "hosted Windows session: $session" | Set-Content -NoNewline $receipt
          $digest = (Get-FileHash -Algorithm SHA256 $receipt).Hash.ToLowerInvariant()
          @{
            schema_version = 1
            repository = "AI-Ascension/ascension-watchdog"
            evidence_kind = "synthetic"
            result = "passed"
            source_revision = "${{ github.sha }}"
            runner = @{ os = "windows"; session_id = $session; service_session_zero = $false }
            checks = @(@{ name = "hosted-windows-session-classification"; outcome = "passed"; receipt_sha256 = $digest })
          } | ConvertTo-Json -Depth 4 -Compress | Write-Output
          Write-Output "This hosted synthetic lane does not run or qualify the session-0 native boundary. Native qualification is restricted to native-qualification.yml."
      - name: Build exact locked release
        run: cargo build --workspace --release --locked

  dependencies:
    name: Dependency security and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Install pinned dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency advisories and licenses
        run: cargo deny --locked check advisories licenses bans sources
